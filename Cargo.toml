[package]
name = "home-dashboard"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Native Wayland home dashboard: clock, system status and rotating backgrounds"
rust-version = "1.88"
publish = false

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.18"
femtovg = { version = "0.28", default-features = false, features = ["textlayout"] }
zune-jpeg = "0.5"
zune-png = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
svgtypes = "0.16.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
