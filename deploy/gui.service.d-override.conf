# Drop-in for an image-based (bootc) host whose /usr/bin/labhf-gui and
# gui.service still launch WPE MiniBrowser: install as
# /etc/systemd/system/gui.service.d/override.conf, with deploy/labhf-gui copied
# to /var/lib/labhf-bin/labhf-gui and the dashboard to
# /var/lib/labhf-bin/home-dashboard. Drop it once the OS image ships
# deploy/labhf-gui and deploy/gui.service.
[Unit]
Description=Auto-login gui session: cage + home dashboard on tty1

[Service]
EnvironmentFile=-/etc/labhf/home-dashboard.env
ExecStart=
ExecStart=/var/lib/labhf-bin/labhf-gui
# WebKit's bwrap sandbox no longer runs here, so these can be tightened.
ProtectKernelTunables=yes
ProtectKernelLogs=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_NETLINK
