name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [bun-linux-x64]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build executable
        run: bun run build
        env:
          BUILD_EXE: ${{ matrix.target }}
      - name: Package
        run: |
          name="home-dashboard-${GITHUB_REF_NAME}-${TARGET#bun-}"
          mkdir -p "dist/$name"
          cp build/server "dist/$name/home-dashboard"
          cp home-dashboard.service README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
        env:
          TARGET: ${{ matrix.target }}
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*/home-dashboard
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
